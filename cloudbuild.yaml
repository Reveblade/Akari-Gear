# Google Cloud Build - Frontend (Mağaza)
# Deploy: gcloud builds submit --config=cloudbuild.yaml --substitutions=_BACKEND_URL=...,_ADMIN_URL=...
# VITE_ADMIN_URL: Header'daki "Admin Panel" linki için

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_ADMIN_URL=${_ADMIN_URL}'
      - '--build-arg'
      - 'VITE_BACKEND_URL=${_BACKEND_URL}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--no-use-http2'
      - '--set-env-vars=BACKEND_URL=${_BACKEND_URL}'
substitutions:
  _REGION: europe-west1
  _REPOSITORY: mousepad
  _SERVICE: frontend
  _BACKEND_URL: ''
  _ADMIN_URL: ''
  _TAG: latest
options:
  logging: CLOUD_LOGGING_ONLY
