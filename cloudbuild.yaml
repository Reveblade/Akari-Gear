# Google Cloud Build - Admin Panel
# Deploy: gcloud builds submit --config=cloudbuild.yaml .
# BACKEND_URL ve VITE_FRONTEND_URL build arg olarak verilmeli

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_FRONTEND_URL=${_FRONTEND_URL}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--no-use-http2'
      - '--set-env-vars=BACKEND_URL=${_BACKEND_URL}'
substitutions:
  _REGION: europe-west1
  _REPOSITORY: mousepad
  _SERVICE: admin
  _BACKEND_URL: ''
  _FRONTEND_URL: ''
  _TAG: latest
options:
  logging: CLOUD_LOGGING_ONLY
